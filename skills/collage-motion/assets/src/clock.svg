<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Round wall clock showing ten past ten, with a red rim. -->
  <g id="dial">
    <circle cx="150" cy="150" r="126" fill="red"/>
    <circle cx="150" cy="150" r="102" fill="cream"/>
    <line x1="150" y1="64" x2="150" y2="78" stroke="graphite" stroke-width="8" data-rim="0"/>
    <line x1="150" y1="222" x2="150" y2="236" stroke="graphite" stroke-width="8" data-rim="0"/>
    <line x1="64" y1="150" x2="78" y2="150" stroke="graphite" stroke-width="8" data-rim="0"/>
    <line x1="222" y1="150" x2="236" y2="150" stroke="graphite" stroke-width="8" data-rim="0"/>
  </g>
  <g id="hour-hand" data-pivot="150,150">
    <line x1="150" y1="150" x2="110" y2="116" stroke="graphite" stroke-width="12" data-rim="0"/>
  </g>
  <g id="minute-hand" data-pivot="150,150">
    <line x1="150" y1="150" x2="196" y2="82" stroke="black" stroke-width="8" data-rim="0"/>
  </g>
  <g id="hub" data-pivot="150,150">
    <circle cx="150" cy="150" r="11" fill="yellow" data-cut="smooth" data-rim="0"/>
  </g>
</svg>
