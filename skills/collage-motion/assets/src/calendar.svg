<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340">
  <!-- Wall calendar with rings, a red header, a grid of days and one marked day. -->
  <g id="calendar">
    <polygon points="30,48 272,44 278,308 26,314" fill="cream"/>
    <polygon points="30,48 272,44 274,100 28,104" fill="red" data-rim="0"/>
    <line x1="58" y1="140" x2="248" y2="138" stroke="silver" stroke-width="6" data-rim="0"/>
    <line x1="56" y1="188" x2="250" y2="186" stroke="silver" stroke-width="6" data-rim="0"/>
    <line x1="54" y1="236" x2="252" y2="234" stroke="silver" stroke-width="6" data-rim="0"/>
    <line x1="110" y1="120" x2="108" y2="290" stroke="silver" stroke-width="6" data-rim="0"/>
    <line x1="164" y1="120" x2="164" y2="290" stroke="silver" stroke-width="6" data-rim="0"/>
    <line x1="216" y1="120" x2="218" y2="290" stroke="silver" stroke-width="6" data-rim="0"/>
    <polygon points="172,146 210,143 212,180 172,182" fill="yellow" data-shadow="2" data-rim="0"/>
  </g>
  <g id="rings">
    <rect x="66" y="26" width="12" height="40" rx="5" fill="graphite" data-rim="0" data-shadow="2"/>
    <rect x="146" y="24" width="12" height="40" rx="5" fill="graphite" data-rim="0" data-shadow="2"/>
    <rect x="226" y="24" width="12" height="40" rx="5" fill="graphite" data-rim="0" data-shadow="2"/>
  </g>
</svg>
